<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FATY STORE</title>
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #d67a8a;
            --primary-hover: #c46878;
            --bg: #faf8f9;
            --card-bg: #ffffff;
            --text-dark: #2c2c2c;
            --text-muted: #7a7a7a;
            --border-color: #f2d6dc;
            --shadow: 0 8px 25px rgba(214, 122, 138, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-dark);
            padding-bottom: 90px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            border-bottom: 1px solid var(--border-color);
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: #fdf5f6;
            border: 1px solid var(--border-color);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary);
            color: white;
            font-size: 11px;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        /* Hero Banner */
        .hero-banner {
            max-width: 1000px;
            margin: 15px auto;
            padding: 0 15px;
        }

        .banner-card {
            background: linear-gradient(135deg, #fdf5f6 0%, #f9e8eb 100%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px 20px;
            text-align: center;
        }

        .banner-card h2 {
            font-size: 20px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .banner-card p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Container & Search */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            outline: none;
            background: white;
            font-size: 14px;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }

        /* Product Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #fdf5f6;
        }

        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-dark);
        }

        .product-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary);
        }

        .add-cart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-controls {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 5px;
        }

        .admin-btn {
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            color: #333;
            font-size: 12px;
            cursor: pointer;
        }

        /* Cart Drawer & Modals */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #eee;
        }

        .cart-item img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-size: 13px;
            font-weight: 700;
        }

        .cart-item-price {
            font-size: 12px;
            color: var(--primary);
            font-weight: bold;
        }

        .qty-btn {
            background: #eee;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Footer Links */
        .footer-social {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .insta-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #d6249f;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-gem"></i> FATY STORE
            </a>
            <div class="header-actions">
                <button class="icon-btn" onclick="handleAdminLogin()" title="لوحة التحكم">
                    <i class="fa-solid fa-lock"></i>
                </button>
                <button class="icon-btn" onclick="toggleCartModal()">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="hero-banner">
        <div class="banner-card">
            <h2>أهلاً بكم في FATY STORE 🌸</h2>
            <p>تسوقي أحدث العروض والمنتجات الحصرية بكل سهولة</p>
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="ابحث عن منتج..." oninput="filterProducts()">
        </div>

        <div class="products-grid" id="products-container">
            <!-- المنتجات تظهر هنا -->
        </div>

        <div class="footer-social">
            <a href="https://instagram.com/faty_storee1" target="_blank" class="insta-link">
                <i class="fa-brands fa-instagram fa-lg"></i> faty_storee1
            </a>
        </div>
    </div>

    <!-- Modal السلة -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>سلة الشراء 🛍️</h3>
                <i class="fa-solid fa-xmark" onclick="toggleCartModal()" style="cursor:pointer"></i>
            </div>
            <div id="cart-items-container"></div>
            <div style="margin-top:15px; text-align:left; font-weight:bold;">
                المجموع الكلي: <span id="cart-total" style="color:var(--primary)">0</span> د.ع
            </div>
            <hr style="margin: 15px 0; border:0; border-top:1px dashed #eee;">
            <div class="form-group">
                <label>الاسم الكامل:</label>
                <input type="text" id="client-name" placeholder="ادخل اسمك">
            </div>
            <div class="form-group">
                <label>رقم الهاتف:</label>
                <input type="tel" id="client-phone" placeholder="ادخل رقم الهاتف">
            </div>
            <div class="form-group">
                <label>العنوان التفصيلي (المحافظة / المنطقة):</label>
                <input type="text" id="client-address" placeholder="ادخل العنوان">
            </div>
            <button class="submit-btn" onclick="sendOrderToWhatsApp()">إرسال الطلب عبر الواتساب <i class="fa-brands fa-whatsapp"></i></button>
        </div>
    </div>

    <!-- Modal إضافة / تعديل منتج (الأدمن) -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-admin-title">إضافة منتج جديد 📦</h3>
                <i class="fa-solid fa-xmark" onclick="toggleAdminModal()" style="cursor:pointer"></i>
            </div>
            <form id="product-form" onsubmit="saveProduct(event)">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label>السعر (د.ع):</label>
                    <input type="number" id="prod-price" required>
                </div>
                <div class="form-group">
                    <label>رابط الصورة:</label>
                    <input type="url" id="prod-img" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>الوصف:</label>
                    <textarea id="prod-desc" rows="3"></textarea>
                </div>
                <button type="submit" class="submit-btn">حفظ المنتج</button>
            </form>
        </div>
    </div>

    <script>
        // إعدادات البيانات المحلية والرمز
        const ADMIN_PASS = '197654';
        let isAdminLoggedIn = false;
        let products = JSON.parse(localStorage.getItem('faty_products')) || [
            { id: 1, name: 'منتج تجريبي 1', price: 15000, img: 'https://via.placeholder.com/200', desc: 'وصف تجريبي للمنتج الأول' }
        ];
        let cart = [];

        function renderProducts(list = products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${isAdminLoggedIn ? `
                        <div class="admin-controls">
                            <button class="admin-btn" onclick="editProduct(${item.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="admin-btn" onclick="deleteProduct(${item.id})" style="color:red"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : ''}
                    <img src="${item.img}" class="product-img" alt="${item.name}">
                    <div class="product-info">
                        <div class="product-title">${item.name}</div>
                        <div class="product-desc">${item.desc || ''}</div>
                        <div class="product-bottom">
                            <div class="product-price">${Number(item.price).toLocaleString()} د.ع</div>
                            <button class="add-cart-btn" onclick="addToCart(${item.id})">إضافة <i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleAdminLogin() {
            if (isAdminLoggedIn) {
                document.getElementById('product-form').reset();
                document.getElementById('prod-id').value = '';
                document.getElementById('modal-admin-title').innerText = 'إضافة منتج جديد 📦';
                toggleAdminModal();
                return;
            }
            const pass = prompt('ادخل رمز الدخول للوحة التحكم:');
            if (pass && pass.trim() === ADMIN_PASS) {
                isAdminLoggedIn = true;
                alert('تم تسجيل الدخول بنجاح كأدمن 🔑');
                renderProducts();
                toggleAdminModal();
            } else if (pass !== null) {
                alert('الرمز غير صحيح!');
            }
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const img = document.getElementById('prod-img').value;
            const desc = document.getElementById('prod-desc').value;

            if (id) {
                const idx = products.findIndex(p => p.id == id);
                products[idx] = { id: Number(id), name, price, img, desc };
            } else {
                products.push({ id: Date.now(), name, price, img, desc });
            }

            localStorage.setItem('faty_products', JSON.stringify(products));
            renderProducts();
            toggleAdminModal();
        }

        function editProduct(id) {
            const prod = products.find(p => p.id == id);
            if (!prod) return;
            document.getElementById('prod-id').value = prod.id;
            document.getElementById('prod-name').value = prod.name;
            document.getElementById('prod-price').value = prod.price;
            document.getElementById('prod-img').value = prod.img;
            document.getElementById('prod-desc').value = prod.desc || '';
            document.getElementById('modal-admin-title').innerText = 'تعديل المنتج ✏️';
            toggleAdminModal();
        }

        function deleteProduct(id) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
                products = products.filter(p => p.id != id);
                localStorage.setItem('faty_products', JSON.stringify(products));
                renderProducts();
            }
        }

        function addToCart(id) {
            const prod = products.find(p => p.id == id);
            const exist = cart.find(c => c.id == id);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
            const container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                container.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.img}">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${Number(item.price).toLocaleString()} د.ع</div>
                        </div>
                        <div>
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            <span style="margin: 0 5px; font-weight:bold;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-total').innerText = total.toLocaleString();
        }

        function changeQty(id, delta) {
            const item = cart.find(c => c.id == id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(c => c.id != id);
            }
            updateCart();
        }

        function sendOrderToWhatsApp() {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const address = document.getElementById('client-address').value.trim();

            if (!name || !phone || !address) {
                alert('يرجى كتابة كافة البيانات إتمام الطلب!');
                return;
            }
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            let text = `*طلب جديد من FATY STORE 🛍️*\n\n`;
            text += `*اسم الزبون:* ${name}\n`;
            text += `*رقم الهاتف:* ${phone}\n`;
            text += `*العنوان:* ${address}\n\n`;
            text += `*الطلبات:*\n`;

            let total = 0;
            cart.forEach(item => {
                text += `- ${item.name} (العدد: ${item.qty}) -> ${(item.price * item.qty).toLocaleString()} د.ع\n`;
                total += item.price * item.qty;
            });

            text += `\n*المجموع الكلي:* ${total.toLocaleString()} د.ع`;

            // استبدل رقم الواتساب الخاص بالزبونة هنا
            const whatsappNumber = "9647000000000"; 
            window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function filterProducts() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(q));
            renderProducts(filtered);
        }

        function toggleCartModal() {
            const m = document.getElementById('cart-modal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        function toggleAdminModal() {
            const m = document.getElementById('admin-modal');
            m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
        }

        // تشغيل البداية
        renderProducts();
    </script>
</body>
</html>
